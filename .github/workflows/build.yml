name: Build Flutter APK
on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download ZIP from release
        run: |
          TAG=${{ github.event.release.tag_name }}
          mkdir -p ./tmp
          gh release download $TAG --repo ${{ github.repository }} -D ./tmp --pattern "*.zip" || gh release download $TAG --repo ${{ github.repository }} -D ./tmp
          ZIPFILE=$(find ./tmp -name "*.zip" | head -n 1)
          mkdir -p ./project
          unzip -o "$ZIPFILE" -d ./project || true
          ls -la ./project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Find pubspec.yaml and Build APK
        run: |
          PUBSPEC_DIR=$(find ./project -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "Found pubspec at: $PUBSPEC_DIR"
          cd "$PUBSPEC_DIR"
          flutter pub get
          flutter build apk --release --verbose
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          cp "$APK_PATH" /tmp/app-release.apk
      - name: Upload APK to Release
        run: |
          TAG=${{ github.event.release.tag_name }}
          gh release upload $TAG /tmp/app-release.apk --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK as Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: /tmp/app-release.apk
