name: Build Flutter APK
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ZIP
        run: |
          TAG=${{ github.event.release.tag_name || inputs.tag }}
          gh release download $TAG -D ./tmp || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Build APK
        run: |
          cd tmp
          unzip -o *.zip -d project || unzip -o *.ZIP -d project || true
          cd project
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        run: |
          TAG=${{ github.event.release.tag_name || inputs.tag }}
          gh release upload $TAG tmp/project/build/app/outputs/flutter-apk/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
