name: Web2APK Build
run-name: "Web2APK - ${{ github.event.inputs.app_id }}"

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID'
        required: true
      web_url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      mode:
        description: 'Stealth mode'
        required: false
        default: 'normal'
      stealth_json:
        description: 'Stealth config JSON'
        required: false
        default: '{}'

jobs:
  # ==========================================
  # JOB 1: DETEKSI JENIS PROJECT
  # ==========================================
  detect-project:
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.check.outputs.type }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect Project Type
        id: check
        run: |
          ROOT="$GITHUB_WORKSPACE/project"
          PUBSPEC=$(find "$ROOT" -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          INDEX_HTML=$(find "$ROOT" -name "index.html" -not -path "*/node_modules/*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)

          if [ -n "$PUBSPEC" ]; then
            echo "📦 TYPE: FLUTTER PROJECT"
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -n "$INDEX_HTML" ]; then
            echo "🌐 TYPE: WEB ZIP (HTML/JS)"
            echo "type=web" >> $GITHUB_OUTPUT
          else
            echo "❌ Unknown project type!"
            echo "type=unknown" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # JOB 2: BUILD FLUTTER PROJECT
  # ==========================================
  build-flutter:
    needs: detect-project
    if: needs.detect-project.outputs.project_type == 'flutter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Detect & Build (Flutter)
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          WEB_URL: ${{ github.event.inputs.web_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/project"
          PUBSPEC=$(find "$ROOT" -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          cd "$(dirname "$PUBSPEC")"
          
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

          # --- FIX GEOLOCATOR ---
          if ! grep -q "dependency_overrides" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "dependency_overrides:" >> pubspec.yaml
            echo "  geolocator_android: 4.6.1" >> pubspec.yaml
          fi

          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

          # --- FIX MANIFEST (PHP) ---
          php -r '
            $manifest = file_get_contents("android/app/src/main/AndroidManifest.xml");
            if (strpos($manifest, "android.permission.INTERNET") === false) {
              $permissions = "\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\"/>\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.DOWNLOAD_WITHOUT_NOTIFICATION\"/>\n";
              $manifest = preg_replace("/(<manifest[^>]*>)/", "$1" . $permissions, $manifest, 1);
            }
            if (strpos($manifest, "usesCleartextTraffic") === false) {
              $manifest = preg_replace("/(<application[^>]*)/", "$1 android:usesCleartextTraffic=\"true\" android:requestLegacyExternalStorage=\"true\"", $manifest, 1);
            }
            file_put_contents("android/app/src/main/AndroidManifest.xml", $manifest);
          '

          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=./debug-info
          APK="$(pwd)/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK file not found after build!"
            exit 1
          fi
          
          # Setup Ikon
          if [ -n "$ICON_URL" ]; then
            curl -sL "$ICON_URL" -o /tmp/icon.png || true
            if [ -s /tmp/icon.png ]; then
              cat > flutter_launcher_icons.yaml << YAML_EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "/tmp/icon.png"
          YAML_EOF
              flutter pub add flutter_launcher_icons --dev
              flutter pub get
              dart run flutter_launcher_icons || true
            fi
          fi
          
          cp "$APK" /tmp/app-release.apk

      - name: Upload APK to Release
        run: |
          TAG="${{ github.event.inputs.app_id }}"
          gh release create "$TAG" /tmp/app-release.apk --title "Web2APK - ${{ github.event.inputs.app_name }}" --notes "URL: ${{ github.event.inputs.web_url }}" || gh release upload "$TAG" /tmp/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 3: BUILD WEB ZIP (HTML/JS)
  # ==========================================
  build-web:
    needs: detect-project
    if: needs.detect-project.outputs.project_type == 'web'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Detect & Build (Web ZIP)
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          WEB_URL: ${{ github.event.inputs.web_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/project"
          INDEX_HTML=$(find "$ROOT" -name "index.html" -not -path "*/node_modules/*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          WEB_DIR=$(dirname "$INDEX_HTML")

          APP_DIR=/tmp/webview_build
          flutter create --org com.anonymous --project-name webview_app --platforms=android "$APP_DIR"
          cd "$APP_DIR"

          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

          flutter pub add webview_flutter
          flutter pub add flutter_downloader
          flutter pub add permission_handler

          mkdir -p assets/www
          cp -r "$WEB_DIR"/. assets/www/

          cat << 'DART_EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:flutter_downloader/flutter_downloader.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await FlutterDownloader.initialize(debug: false, ignoreSsl: true);
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: const WebViewScreen());
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _requestPermissions();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageFinished: (_) => setState(() => _loading = false),
                ))
                ..loadFlutterAsset('assets/www/index.html');
            }

            Future<void> _requestPermissions() async {
              await Permission.storage.request();
              await Permission.notification.request();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(body: Stack(children: [
                WebViewWidget(controller: controller),
                if (_loading) const Center(child: CircularProgressIndicator())
              ]));
            }
          }
          DART_EOF

          {
            echo "  assets:"
            find assets -type d | sed 's|$|/|; s|^|    - |'
          } > /tmp/assets.txt
          sed -i '/^flutter:/r /tmp/assets.txt' pubspec.yaml

          # --- FIX MANIFEST WEB ZIP (PHP) ---
          php -r '
            $manifest = file_get_contents("android/app/src/main/AndroidManifest.xml");
            
            # 1. Tambahkan Izin
            if (strpos($manifest, "android.permission.INTERNET") === false) {
              $permissions = "\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\"/>\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.DOWNLOAD_WITHOUT_NOTIFICATION\"/>\n";
              $manifest = preg_replace("/(<manifest[^>]*>)/", "$1" . $permissions, $manifest, 1);
            }
            
            # 2. Tambahkan Atribut Application
            if (strpos($manifest, "usesCleartextTraffic") === false) {
              $manifest = preg_replace("/(<application[^>]*)/", "$1 android:usesCleartextTraffic=\"true\" android:requestLegacyExternalStorage=\"true\"", $manifest, 1);
            }
            
            # 3. Tambahkan Provider & Receiver untuk Flutter Downloader
            if (strpos($manifest, "flutter_downloader.provider") === false) {
              $downloader_nodes = "
                  <provider
                      android:name=\"vn.hunghd.flutterdownloader.DownloadedFileProvider\"
                      android:authorities=\"\${applicationId}.flutter_downloader.provider\"
                      android:exported=\"false\"
                      android:grantUriPermissions=\"true\">
                      <meta-data
                          android:name=\"android.support.FILE_PROVIDER_PATHS\"
                          android:resource=\"@xml/provider_paths\"/>
                  </provider>
                  <provider
                      android:name=\"vn.hunghd.flutterdownloader.FlutterDownloaderInitializer\"
                      android:authorities=\"\${applicationId}.flutter_downloader.provider.initializer\"
                      android:exported=\"false\" />
              ";
              $manifest = preg_replace("/(<\/application>)/", $downloader_nodes . "$1", $manifest, 1);
            }
            
            file_put_contents("android/app/src/main/AndroidManifest.xml", $manifest);
          '
          
          # --- TAMBAHKAN FILE PROVIDER_PATHS.XML ---
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/provider_paths.xml << 'XML_EOF'
<?xml version="1.0" encoding="utf-8"?>
<paths>
    <external-path name="external_files" path="."/>
    <cache-path name="cache" path="."/>
    <external-files-path name="external_files" path="."/>
</paths>
XML_EOF

          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=./debug-info
          APK="$(pwd)/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK file not found after build!"
            exit 1
          fi
          
          # Setup Ikon
          if [ -n "$ICON_URL" ]; then
            curl -sL "$ICON_URL" -o /tmp/icon.png || true
            if [ -s /tmp/icon.png ]; then
              cat > flutter_launcher_icons.yaml << YAML_EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "/tmp/icon.png"
          YAML_EOF
              flutter pub add flutter_launcher_icons --dev
              flutter pub get
              dart run flutter_launcher_icons || true
            fi
          fi
          
          cp "$APK" /tmp/app-release.apk

      - name: Upload APK to Release
        run: |
          TAG="${{ github.event.inputs.app_id }}"
          gh release create "$TAG" /tmp/app-release.apk --title "Web2APK - ${{ github.event.inputs.app_name }}" --notes "URL: ${{ github.event.inputs.web_url }}" || gh release upload "$TAG" /tmp/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
