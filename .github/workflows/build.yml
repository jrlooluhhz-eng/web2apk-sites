name: Build APK Universal
on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Download ZIP
        run: |
          TAG=${{ github.event.release.tag_name }}
          mkdir -p /tmp/build
          for i in 1 2 3 4 5 6; do
            gh release download $TAG --repo ${{ github.repository }} -D /tmp/build --pattern "*.zip" 2>/dev/null && break
            sleep 5
          done
          ZIPFILE=$(find /tmp/build -name "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "❌ No ZIP found in release!"
            exit 1
          fi
          mkdir -p ./project
          unzip -o "$ZIPFILE" -d ./project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
      
      - name: Detect & Build
        run: |
          PUBSPEC=$(find ./project -name "pubspec.yaml" | head -n 1)
          INDEX_HTML=$(find ./project -name "index.html" | head -n 1)
          
          if [ -n "$PUBSPEC" ]; then
            echo "📦 TYPE: FLUTTER PROJECT"
            DIR=$(dirname "$PUBSPEC")
            cd "$DIR"
            if [ ! -d "android" ]; then
              flutter create . --platforms=android
            fi
            mkdir -p android
            echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
            flutter pub get
            flutter build apk --release -v
            APK=$(find . -name "app-release.apk" | head -n 1)
            
          elif [ -n "$INDEX_HTML" ]; then
            echo "🌐 TYPE: HTML PROJECT (WebView wrapper)"
            cd ./project
            flutter create --org com.anonymous --project-name webview_app webview_build
            cd webview_build
            flutter pub add webview_flutter
            mkdir -p assets/www
            cp -r ../. ./assets/www/ 2>/dev/null || true
            
            echo 'import "package:flutter/material.dart";' > lib/main.dart
            echo 'import "package:webview_flutter/webview_flutter.dart";' >> lib/main.dart
            echo 'void main() => runApp(const MyApp());' >> lib/main.dart
            echo 'class MyApp extends StatelessWidget {' >> lib/main.dart
            echo '  const MyApp({super.key});' >> lib/main.dart
            echo '  @override' >> lib/main.dart
            echo '  Widget build(BuildContext context) {' >> lib/main.dart
            echo '    return MaterialApp(debugShowCheckedModeBanner: false, home: const WebViewScreen());' >> lib/main.dart
            echo '  }' >> lib/main.dart
            echo '}' >> lib/main.dart
            echo 'class WebViewScreen extends StatefulWidget {' >> lib/main.dart
            echo '  const WebViewScreen({super.key});' >> lib/main.dart
            echo '  @override' >> lib/main.dart
            echo '  State<WebViewScreen> createState() => _WebViewScreenState();' >> lib/main.dart
            echo '}' >> lib/main.dart
            echo 'class _WebViewScreenState extends State<WebViewScreen> {' >> lib/main.dart
            echo '  late final WebViewController controller;' >> lib/main.dart
            echo '  bool _loading = true;' >> lib/main.dart
            echo '  @override' >> lib/main.dart
            echo '  void initState() {' >> lib/main.dart
            echo '    super.initState();' >> lib/main.dart
            echo '    controller = WebViewController()' >> lib/main.dart
            echo '      ..setJavaScriptMode(JavaScriptMode.unrestricted)' >> lib/main.dart
            echo '      ..setNavigationDelegate(NavigationDelegate(onPageFinished: (_) => setState(() => _loading = false)))' >> lib/main.dart
            echo '      ..loadFlutterAsset("assets/www/index.html");' >> lib/main.dart
            echo '  }' >> lib/main.dart
            echo '  @override' >> lib/main.dart
            echo '  Widget build(BuildContext context) {' >> lib/main.dart
            echo '    return Scaffold(body: Stack(children: [WebViewWidget(controller: controller), if (_loading) const Center(child: CircularProgressIndicator())]));' >> lib/main.dart
            echo '  }' >> lib/main.dart
            echo '}' >> lib/main.dart
            
            echo "  assets:" >> pubspec.yaml
            echo "    - assets/www/" >> pubspec.yaml
            
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            fi
            mkdir -p android
            echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
            flutter pub get
            flutter build apk --release -v
            APK=$(find . -name "app-release.apk" | head -n 1)
            
          else
            echo "❌ Unknown project type!"
            exit 1
          fi
          
          if [ -z "$APK" ]; then
            echo "❌ APK file not found after build!"
            exit 1
          fi
          cp "$APK" /tmp/app-release.apk
      
      - name: Upload APK to Release
        run: |
          TAG=${{ github.event.release.tag_name }}
          gh release upload $TAG /tmp/app-release.apk --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
