name: Web2APK Build
run-name: "Web2APK - ${{ github.event.inputs.app_id }}"

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID'
        required: true
      web_url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      mode:
        description: 'Stealth mode'
        required: false
        default: 'normal'
      stealth_json:
        description: 'Stealth config JSON'
        required: false
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
      
      - name: Build WebView APK
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          WEB_URL: ${{ github.event.inputs.web_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_URL: ${{ github.event.inputs.icon_url }}
          STEALTH_JSON: ${{ github.event.inputs.stealth_json }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_' | cut -c1-20)
          [ -z "$SAFE_NAME" ] && SAFE_NAME="webapp"
          
          flutter create --org com.anonymous --project-name "$SAFE_NAME" .
          flutter pub add webview_flutter
          # Tambahan package untuk menangani download bawaan WebView
          flutter pub add flutter_downloader
          flutter pub add flutter_launcher_icons --dev
          
          cat > lib/main.dart << DART_EOF
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:flutter_downloader/flutter_downloader.dart';
          import 'package:flutter/services.dart';
          
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await FlutterDownloader.initialize(debug: false, ignoreSsl: true);
            runApp(const MyApp());
          }
          
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '$APP_NAME',
                debugShowCheckedModeBanner: false,
                home: const WebViewScreen(),
              );
            }
          }
          
          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }
          
          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;
            bool _loading = true;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                // Mengaktifkan akses file & storage di WebView
                ..setNavigationDelegate(NavigationDelegate(
                  onPageFinished: (_) => setState(() => _loading = false),
                  onNavigationRequest: (request) {
                    // Biarkan WebView memproses URL
                    return NavigationDecision.navigate;
                  },
                ))
                // Tambahkan listener untuk mendeteksi link download
                ..setPlatformNavigationDelegate(NavigationDelegate(
                  onUrlChange: (change) {},
                ));
                
              // Konfigurasi khusus Android untuk mengizinkan file access
              controller.loadRequest(Uri.parse('$WEB_URL'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Stack(children: [
                  WebViewWidget(controller: controller),
                  if (_loading) const Center(child: CircularProgressIndicator()),
                ]),
              );
            }
          }
          DART_EOF
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i "s|android:label=\".*\"|android:label=\"$APP_NAME\"|" "$MANIFEST"
          
          # --- UPDATE IZIN: Tambah izin Internet, Storage, dan Media ---
          # Hapus baris lama jika ada, lalu tambahkan yang baru
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION"/>' "$MANIFEST"
          fi
          
          # Izinkan cleartext HTTP (untuk web lokal/http) dan tambahkan requestLegacyExternalStorage
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|' "$MANIFEST"
          # -------------------------------------------------------------
          
          if [ -n "$ICON_URL" ]; then
            curl -sL "$ICON_URL" -o /tmp/icon.png || true
            if [ -s /tmp/icon.png ]; then
              cat > flutter_launcher_icons.yaml << YAML_EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "/tmp/icon.png"
          YAML_EOF
              flutter pub get
              dart run flutter_launcher_icons || true
            fi
          fi
          
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          flutter build apk --release -v --obfuscate --split-debug-info=./debug-info
          
          APK=$(find . -name "app-release.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/app.apk
      
      - name: Upload APK to Release
        run: |
          TAG="${{ github.event.inputs.app_id }}"
          gh release create "$TAG" /tmp/out/app.apk --title "Web2APK - ${{ github.event.inputs.app_name }}" --notes "URL: ${{ github.event.inputs.web_url }}" || gh release upload "$TAG" /tmp/out/app.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
