name: Web2APK Build
run-name: "Web2APK - ${{ github.event.inputs.app_id }}"

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID'
        required: true
      web_url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      mode:
        description: 'Stealth mode'
        required: false
        default: 'normal'
      stealth_json:
        description: 'Stealth config JSON'
        required: false
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8' # Menggunakan versi stabil terbaru
          channel: 'stable'
          cache: true
      
      - name: Build WebView APK
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          WEB_URL: ${{ github.event.inputs.web_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_URL: ${{ github.event.inputs.icon_url }}
          STEALTH_JSON: ${{ github.event.inputs.stealth_json }}
        run: |
          # Sanitize app name for project name
          SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_' | cut -c1-20)
          [ -z "$SAFE_NAME" ] && SAFE_NAME="webapp"
          
          flutter create --org com.anonymous --project-name "$SAFE_NAME" .
          flutter pub add webview_flutter
          flutter pub add flutter_launcher_icons --dev
          
          # Generate main.dart
          cat > lib/main.dart << DART_EOF
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          
          void main() => runApp(const MyApp());
          
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '$APP_NAME',
                debugShowCheckedModeBanner: false,
                home: const WebViewScreen(),
              );
            }
          }
          
          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }
          
          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;
            bool _loading = true;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageFinished: (_) => setState(() => _loading = false),
                ))
                ..loadRequest(Uri.parse('$WEB_URL'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Stack(children: [
                  WebViewWidget(controller: controller),
                  if (_loading) const Center(child: CircularProgressIndicator()),
                ]),
              );
            }
          }
          DART_EOF
          
          # Set app label
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i "s|android:label=\".*\"|android:label=\"$APP_NAME\"|" "$MANIFEST"
          
          # Internet permission
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          
          # Custom icon if provided
          if [ -n "$ICON_URL" ]; then
            curl -sL "$ICON_URL" -o /tmp/icon.png || true
            if [ -s /tmp/icon.png ]; then
              cat > flutter_launcher_icons.yaml << YAML_EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "/tmp/icon.png"
          YAML_EOF
              flutter pub get
              dart run flutter_launcher_icons || true
            fi
          fi
          
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          flutter build apk --release -v
          
          APK=$(find . -name "app-release.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          
          # Upload as artifact
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/app.apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.app_id }}
          path: /tmp/out/app.apk
